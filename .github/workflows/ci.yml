name: CodexTrader V1 checks

on:
  push:
    branches: [codextrader-v1-safety]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript checks
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
